[package]
name = "whelk-benches"
description = "Benchmarks for the whelk shell"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
whelk-executor = { workspace = true }
whelk-line = { workspace = true }
whelk-parser = { workspace = true }
whelk-process = { workspace = true }

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "processes"
harness = false

[[bench]]
name = "editing"
harness = false

[lints]
workspace = true

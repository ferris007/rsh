[workspace]
resolver = "2"
members = [
    "crates/whelk",
    "crates/whelk-parser",
    "crates/whelk-process",
    "crates/whelk-executor",
    "crates/whelk-job",
    "crates/whelk-terminal",
    "crates/whelk-line",
    "crates/whelk-event",
    "crates/whelk-trace",
    "benches",
    "experiments/fork_exec",
    "experiments/file_descriptors",
    "experiments/pipes",
    "experiments/signals",
    "experiments/process_groups",
    "experiments/pty",
    "experiments/epoll",
    "experiments/namespaces",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferris007/whelk"
authors = ["whelk contributors"]

[workspace.dependencies]
whelk-parser = { path = "crates/whelk-parser" }
whelk-process = { path = "crates/whelk-process" }
whelk-job = { path = "crates/whelk-job" }
whelk-terminal = { path = "crates/whelk-terminal" }
whelk-line = { path = "crates/whelk-line" }
whelk-event = { path = "crates/whelk-event" }
whelk-trace = { path = "crates/whelk-trace" }
whelk-executor = { path = "crates/whelk-executor" }

# Thin, mostly-safe wrappers over libc. Chosen over raw `libc` so that the
# `unsafe` in this project is limited to the places where the *semantics* are
# genuinely unsafe (fork, exec), not to every syscall.
nix = { version = "0.31", default-features = false, features = ["event", "fs", "process", "sched", "signal", "term"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Systems code below the shell surface returns raw ints on purpose.
cast_possible_truncation = "allow"

[profile.release]
debug = 1        # keep frame pointers/symbols for flamegraphs (Phase 10)

[workspace]
resolver = "2"
members = [
    "crates/rsh",
    "crates/rsh-parser",
    "crates/rsh-process",
    "crates/rsh-executor",
    "crates/rsh-job",
    "crates/rsh-terminal",
    "crates/rsh-line",
    "crates/rsh-event",
    "crates/rsh-trace",
    "benches",
    "experiments/fork_exec",
    "experiments/file_descriptors",
    "experiments/pipes",
    "experiments/signals",
    "experiments/process_groups",
    "experiments/pty",
    "experiments/epoll",
    "experiments/namespaces",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferris007/rsh"
authors = ["rsh contributors"]

[workspace.dependencies]
rsh-parser = { path = "crates/rsh-parser" }
rsh-process = { path = "crates/rsh-process" }
rsh-job = { path = "crates/rsh-job" }
rsh-terminal = { path = "crates/rsh-terminal" }
rsh-line = { path = "crates/rsh-line" }
rsh-event = { path = "crates/rsh-event" }
rsh-trace = { path = "crates/rsh-trace" }
rsh-executor = { path = "crates/rsh-executor" }

# Thin, mostly-safe wrappers over libc. Chosen over raw `libc` so that the
# `unsafe` in this project is limited to the places where the *semantics* are
# genuinely unsafe (fork, exec), not to every syscall.
nix = { version = "0.31", default-features = false, features = ["event", "fs", "process", "sched", "signal", "term"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Systems code below the shell surface returns raw ints on purpose.
cast_possible_truncation = "allow"

[profile.release]
debug = 1        # keep frame pointers/symbols for flamegraphs (Phase 10)

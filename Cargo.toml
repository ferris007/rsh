[workspace]
resolver = "2"
members = [
    "crates/whelk",
    "crates/whelk-parser",
    "crates/whelk-process",
    "crates/whelk-executor",
    "crates/whelk-job",
    "crates/whelk-terminal",
    "crates/whelk-line",
    "crates/whelk-event",
    "crates/whelk-trace",
    "benches",
    "experiments/fork_exec",
    "experiments/file_descriptors",
    "experiments/pipes",
    "experiments/signals",
    "experiments/process_groups",
    "experiments/pty",
    "experiments/epoll",
    "experiments/namespaces",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferris007/whelk"
authors = ["whelk contributors"]

# Both a path and a version, and both are needed. The path is what a build in
# this workspace uses; the version is what `cargo publish` writes into the
# manifest it uploads, having stripped the path out -- a crate on the registry
# cannot refer to a directory on the machine that published it. A path without
# a version publishes nothing: cargo refuses the crate rather than upload one
# whose dependencies nobody else can resolve.
#
# These track the workspace version and have to be raised with it.
[workspace.dependencies]
whelk-parser = { path = "crates/whelk-parser", version = "0.2.1" }
whelk-process = { path = "crates/whelk-process", version = "0.2.1" }
whelk-job = { path = "crates/whelk-job", version = "0.2.1" }
whelk-terminal = { path = "crates/whelk-terminal", version = "0.2.1" }
whelk-line = { path = "crates/whelk-line", version = "0.2.1" }
whelk-event = { path = "crates/whelk-event", version = "0.2.1" }
whelk-trace = { path = "crates/whelk-trace", version = "0.2.1" }
whelk-executor = { path = "crates/whelk-executor", version = "0.2.1" }

# Thin, mostly-safe wrappers over libc. Chosen over raw `libc` so that the
# `unsafe` in this project is limited to the places where the *semantics* are
# genuinely unsafe (fork, exec), not to every syscall.
nix = { version = "0.30", default-features = false, features = ["event", "fs", "process", "sched", "signal", "term"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Systems code below the shell surface returns raw ints on purpose.
cast_possible_truncation = "allow"

[profile.release]
debug = 1        # keep frame pointers/symbols for flamegraphs (Phase 10)

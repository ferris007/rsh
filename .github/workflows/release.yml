# Builds the binaries that go on a release page.
#
# Each target is built on its own operating system rather than cross-compiled.
# A shell is the wrong program to cross-compile casually: it is `fork`, `exec`,
# `tcsetpgrp`, and termios all the way down, and those are exactly the parts a
# cross toolchain gets subtly wrong. Building on the real thing also means the
# test suite that guards the binary ran on the platform it will run on.
#
# `debug = 1` in the release profile keeps symbols for flamegraphs, which is
# right for a working tree and wrong for a download. The binaries are stripped
# on the way into the archive.
#
# Three targets, and the two absences are deliberate. There is no Intel macOS
# build because GitHub is retiring the `macos-13` image and a job that waits an
# hour for a runner that never arrives holds up every release; Intel Macs can
# `cargo install --git`. There is no BSD build, though the README claims BSD
# works, because GitHub has no BSD runner to be honest on.

name: Release

on:
  push:
    tags: ["v*"]
  # So a release that already exists can be given its binaries after the fact.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # The build jobs upload into a release, and on a tag push there is not
  # necessarily one to upload into yet -- the first 0.1.1 build failed with
  # "release not found" because three jobs raced a release that was created a
  # minute later. One job makes the page first, and the rest wait for it, which
  # also keeps three parallel jobs from trying to create it at once.
  prepare:
    name: release page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $tag already exists, leaving its notes alone"
          else
            gh release create "$tag" --repo "$REPO" \
              --title "rsh ${tag#v}" --generate-notes --verify-tag
          fi

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Static, so it runs on any Linux regardless of how old its glibc is.
          # The gnu build above needs glibc 2.39, which rules out Ubuntu 22.04
          # and Debian 12. This one also carries the .deb, for the same reason:
          # a package that depends on libc6 >= 2.39 cannot be installed on the
          # distributions most likely to want it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb: true
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p rsh --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="rsh-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          strip "target/${{ matrix.target }}/release/rsh"
          cp "target/${{ matrix.target }}/release/rsh" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          # Checksums beside the archive: a download nobody can verify is a
          # download nobody should trust.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi

      - name: Check the binary runs
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          bin="dist/rsh-${tag}-${{ matrix.target }}/rsh"
          # A stripped binary that cannot start is worse than no binary. Feed it
          # a command line on stdin, where it takes the non-interactive path.
          echo 'echo release-smoke-test' | "$bin"

      - name: Build a .deb
        if: matrix.deb
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # --strip because `debug = 1` in the release profile otherwise ships
          # 6.7M of symbols to everyone who installs the package. --no-build to
          # package the binary that was just built and smoke-tested, rather than
          # a second one nobody looked at.
          cargo deb -p rsh --target ${{ matrix.target }} --strip --no-build --output dist/

      - name: Check the .deb
        if: matrix.deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          dpkg-deb -I "$deb"
          # Unpack and run it, rather than trusting that a package that built is
          # a package that works.
          dpkg-deb -x "$deb" /tmp/debcheck
          echo 'echo deb-smoke-test' | /tmp/debcheck/usr/bin/rsh

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          gh release upload "$tag" \
            dist/rsh-${tag}-${{ matrix.target }}.tar.gz \
            dist/rsh-${tag}-${{ matrix.target }}.tar.gz.sha256 \
            --clobber
          # The .deb carries its own Debian-style name, so it is uploaded by
          # whatever it turned out to be called rather than by a guess.
          if [ -n "$(ls dist/*.deb 2>/dev/null || true)" ]; then
            gh release upload "$tag" dist/*.deb --clobber
          fi
